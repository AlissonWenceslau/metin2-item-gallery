<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Galeria de Imagens</title>
</head>

<body>
    <header class="glass-header">
        <div class="header-content">
            <h1>Itens Metin2</h1>
            <p id="image-count">Carregando...</p>
        </div>
    </header>

    <main class="gallery-container" id="gallery">
        <!-- Images will be injected here via JS -->
    </main>

    <!-- Custom Tooltip -->
    <div id="custom-tooltip" class="tooltip hidden"></div>

    <!-- Scroll to Top Button -->
    <button id="back-to-top" class="back-to-top hidden" aria-label="Voltar ao topo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"/>
        </svg>
    </button>

    <script src="imageList.js"></script>
    <script src="itemNames.js"></script>
    <script src="main.js"></script>
</body>

</html>
